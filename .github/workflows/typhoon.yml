name: 颱風假檢查

# 每 30 分鐘抓一次人事行政總處的停班停課公告；臺中市宣布停止上班時更新 typhoon.json
# 網站直接從 raw.githubusercontent.com 讀這個檔，不需要重新部署
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: typhoon
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/typhoon.js
      - name: 有變動就推送
        run: |
          if ! git diff --quiet -- typhoon.json || ! git ls-files --error-unmatch typhoon.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add typhoon.json
            git commit -m "更新颱風假資訊（臺中市）[skip ci]"
            git push
          fi
