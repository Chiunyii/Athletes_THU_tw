name: 部署網站

on:
  push:
    branches: [main, master]
  # 每 3 小時重新部署一次，更新 Google 試算表公告的備份與 calendar.ics
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 備份 Google 試算表公告
        run: node scripts/build-sheet.js
      - name: 產生 calendar.ics
        run: node scripts/build-ics.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
