<html lang="zh-Hant">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>體能社團行政群島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="東海大學體能性社團的行政群島：建立你的社團角色，沿著道路查看各類截止日、公告與辦事流程，中心是課外組。">
<meta name="theme-color" content="#E6EADF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Space+Mono:wght@700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 全螢幕 3D 群島；左上品牌卡、右側直排按鈕、底部（桌機為右側）資訊抽屜；引導與角色建立都是同一套奶油色卡片。
   視覺參考「HEART 政策島」：奶油底、赤陶色強調、鼠尾草綠的低多邊形地景、等寬字的編號眉標。單一亮色主題。 */
:root {
  --cream: #FBF6EE; --card: #FFFDF9; --ink: #2A211C; --mut: #7A6B60; --line: #EADFD2;
  --terra: #C8623F; --terra-soft: #F7E4D7; --sage: #A9BE8B; --gold: #E8B04B; --red: #C8443A; --ok: #5F8F5A;
  --sh: 0 10px 30px rgba(60,40,25,.12), 0 2px 6px rgba(60,40,25,.08);
  --f-latin: "Archivo", "Noto Sans TC", system-ui, sans-serif;
  --f-mono: "Space Mono", ui-monospace, "Noto Sans TC", monospace;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --sl: max(12px, env(safe-area-inset-left, 0px)); --sr: max(12px, env(safe-area-inset-right, 0px));
  --sb: env(safe-area-inset-bottom, 0px); --st: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; height: 100dvh; overflow: hidden; margin: 0; }
body { background: #E6EADF; color: var(--ink); font: 400 15px/1.6 var(--f-body); -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--terra); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
a { color: var(--terra); }
#stage { position: fixed; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; touch-action: none; }
#lbl { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.card { background: rgba(255,253,249,.94); border-radius: 22px; box-shadow: var(--sh); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

/* 島名牌：白色膠囊 + 赤陶編號 */
.il { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; align-items: center; gap: 6px; padding: 7px 13px; background: var(--card); border-radius: 999px; box-shadow: var(--sh); font: 900 13px/1.1 var(--f-body); white-space: nowrap; transition: opacity .2s, background .2s; }
.il .no { font: 700 12px/1 var(--f-mono); color: var(--terra); }
.il .d { font: 700 10px/1 var(--f-mono); color: #fff; background: var(--gold); border-radius: 999px; padding: 4px 7px 3px; }
.il .d.hot { background: var(--red); }
.il .ok { width: 16px; height: 16px; border-radius: 50%; background: var(--ok); color: #fff; font: 700 10px/16px var(--f-body); text-align: center; }
.il.sel { background: var(--ink); color: #fff; }
.il.sel .no { color: var(--gold); }
.il.dim { opacity: .4; }
.il.off { visibility: hidden; }
.il.hide { opacity: 0; pointer-events: none; }
.il.me { padding: 6px 14px; font-size: 14px; gap: 6px; }
.il.me span { color: var(--terra); }
#lbl.cmp .il { font-size: 12.5px; padding: 6px 11px; gap: 5px; }
#lbl.cmp .il .no { font-size: 11.5px; }

/* 品牌卡 */
#brand { position: fixed; z-index: 5; top: calc(var(--st) + 12px); left: var(--sl); display: grid; grid-template-columns: auto auto; align-items: center; gap: 4px 16px; padding: 14px 20px; max-width: calc(100% - 140px); transition: opacity .2s; }
#brand .w { font: 900 34px/.9 var(--f-latin); color: var(--terra); letter-spacing: -.02em; }
#brand .t { display: grid; gap: 6px; min-width: 0; }
#brand .t b { font: 900 19px/1.15 var(--f-body); letter-spacing: .08em; }
#brand .t small { font: 700 12.5px/1.2 var(--f-body); letter-spacing: .06em; white-space: nowrap; }
#brand .t small i { font: 800 12.5px/1 var(--f-latin); font-style: normal; color: var(--terra); letter-spacing: .12em; margin-right: 6px; }
#status { position: fixed; z-index: 5; left: var(--sl); top: calc(var(--st) + 112px); display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 140px); }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px; font: 700 13px/1 var(--f-body); white-space: nowrap; }
.pill b { font: 700 15px/1 var(--f-mono); color: var(--red); }
.lamp { width: 9px; height: 9px; border-radius: 50%; background: var(--mut); flex: none; }
.lamp.on { background: #4CAF6E; box-shadow: 0 0 0 3px rgba(76,175,110,.2); }
.lamp.off { background: var(--red); }

/* 右側直排按鈕 */
#rail { position: fixed; z-index: 8; right: var(--sr); top: calc(var(--st) + 12px); display: grid; gap: 10px; justify-items: end; }
.rb { position: relative; display: flex; align-items: center; justify-content: center; gap: 0; min-width: 52px; height: 52px; padding: 0 16px; border-radius: 18px; font: 700 16px/1 var(--f-body); background: rgba(255,253,249,.94); box-shadow: var(--sh); transition: gap .2s; }
/* 預設只顯示圖示；滑鼠移過去（或鍵盤選到）才展開文字 */
.rb span { max-width: 0; overflow: hidden; white-space: nowrap; transition: max-width .2s; }
.rb:hover, .rb:focus-visible { gap: 8px; }
.rb:hover span, .rb:focus-visible span { max-width: 5em; }
.rb svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rb i { font-style: normal; font-size: 17px; width: 20px; text-align: center; }
.rb[aria-pressed="true"] { background: var(--ink); color: #fff; }
.rb .badge { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--red); color: #fff; font: 700 11px/20px var(--f-mono); text-align: center; font-style: normal; }
.rb .badge.n { background: var(--ink); }

#ticker { position: fixed; z-index: 4; left: var(--sl); bottom: calc(var(--sb) + 14px); max-width: min(calc(100% - 24px), 560px); display: flex; gap: 10px; align-items: center; padding: 9px 16px 9px 10px; border-radius: 999px; font-size: 13.5px; text-align: left; }
#ticker .f { min-width: 30px; padding: 0 9px; height: 26px; white-space: nowrap; border-radius: 999px; background: var(--terra); color: #fff; display: grid; place-items: center; font: 900 12px/1 var(--f-body); flex: none; }
#tk { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; transition: opacity .25s; }

/* 資訊抽屜 */
#sheet { position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; max-height: 70vh; max-height: 70dvh; display: flex; flex-direction: column; background: var(--card); border-radius: 30px 30px 0 0; box-shadow: 0 -10px 40px rgba(60,40,25,.18); padding-bottom: var(--sb); }
#sheet .grab { width: 54px; height: 6px; border-radius: 99px; background: #D8CCBF; margin: 12px auto 0; flex: none; }
#sheet .x { position: absolute; right: 16px; top: 18px; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; line-height: 1; color: var(--ink); z-index: 1; }
#sheet .x:hover { background: var(--cream); }
#sbody { overflow: auto; padding: 16px max(22px, env(safe-area-inset-right, 0px)) 26px max(22px, env(safe-area-inset-left, 0px)); overscroll-behavior: contain; display: grid; gap: 16px; align-content: start; }
.sh { display: flex; gap: 16px; align-items: center; padding-right: 40px; }
.tile { width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(160deg, #FDF1E8, var(--terra-soft)); box-shadow: 0 6px 16px rgba(200,98,63,.18); display: grid; place-items: center; font-size: 30px; flex: none; }
.kick { font: 700 12.5px/1.3 var(--f-mono); letter-spacing: .16em; color: var(--terra); text-transform: uppercase; }
.sh h2 { font: 900 24px/1.25 var(--f-body); margin-top: 4px; }
.lead { margin: 0; font-size: 16.5px; font-weight: 500; }
.quote { margin: 0; border-left: 4px solid var(--terra); padding: 2px 0 2px 16px; color: #5B4B40; font-size: 15.5px; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
/* 標籤只是資訊，不可點：扁平、無外框，避免看起來像按鈕 */
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 6px; font: 700 12.5px/1.2 var(--f-body); color: #6B5A4C; background: #F3ECE2; }
.hours { margin: 0; font-size: 15px; font-weight: 500; color: #5B4B40; }
.jump { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.jump.three { grid-template-columns: repeat(3, 1fr); }
.btn.two { flex-direction: column; align-items: flex-start; gap: 3px; padding: 8px 16px; border-radius: 16px; }
.btn.two small { font-size: 11.5px; font-weight: 500; color: var(--mut); white-space: normal; }
.jump .btn { justify-content: center; padding: 11px 10px; font-size: 14px; border-radius: 14px; }
#toTop { position: absolute; right: 16px; bottom: calc(16px + var(--sb)); z-index: 2; width: 48px; height: 48px; padding: 0; justify-content: center; border-radius: 50%; font-size: 20px; box-shadow: 0 6px 18px rgba(42,33,28,.28); }
.sec { scroll-margin-top: 12px; }
.tag.c { background: color-mix(in srgb, var(--c) 16%, white); }
.tag.c::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tag.ok { background: #EEF6EA; color: var(--ok); }
.sec { display: grid; gap: 10px; }
.sec h4 { font: 700 13px/1.2 var(--f-body); letter-spacing: .18em; color: var(--mut); }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.item { border: 1.5px solid var(--line); border-radius: 18px; background: var(--card); overflow: hidden; }
.item.hl { border-color: #EBC3A8; background: #FFF6EE; }
.item > button, .item > .row { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 15px 16px; text-align: left; }
.item .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--terra)); }
.item .nm { font-size: 16px; font-weight: 500; line-height: 1.4; min-width: 0; }
.item .nm small { display: block; font-size: 12.5px; color: var(--mut); font-weight: 400; }
.item .meta { font-size: 13px; color: var(--mut); white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .meta.hot { color: var(--red); font-weight: 700; }
.item .meta.warn { color: #B07A12; font-weight: 700; }
.item .chev { color: var(--mut); transition: transform .2s; }
.item [aria-expanded="true"] .chev { transform: rotate(90deg); }
.item .more { padding: 0 16px 16px 37px; font-size: 14.5px; display: grid; gap: 10px; }
.item .more p { margin: 0; }
.item ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.item ul.files { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-weight: 700; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; background: var(--ink); color: #fff; font: 700 13.5px/1 var(--f-body); text-decoration: none; white-space: nowrap; }
.btn.g { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.t { background: var(--terra); }
.btn.big { padding: 14px 26px; font-size: 16px; border-radius: 16px; }
.btn.ring { box-shadow: 0 0 0 3px #FDF8F2, 0 0 0 6px var(--terra); }
.foot { color: var(--mut); font-size: 13px; margin: 0; }
.empty { color: var(--mut); font-size: 14px; padding: 6px 2px; margin: 0; }
.week { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.week td { padding: 9px 6px; border-bottom: 1px solid var(--line); }
.week td:first-child { font-weight: 700; white-space: nowrap; width: 7.5em; }
.week tr.today td { background: #FFF1E6; }
.week .closed { color: var(--mut); }
.bigst { display: flex; align-items: center; gap: 10px; font: 900 18px/1.3 var(--f-body); }
.search { width: 100%; font: inherit; font-size: 16px; padding: 13px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); outline: none; }
.search:focus { border-color: var(--terra); }
.search::-webkit-search-cancel-button { display: none; }
mark { background: #FBE2B5; color: inherit; border-radius: 3px; padding: 0 1px; }

/* 角色建立 */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tabs button { padding: 13px 0; border-radius: 16px; font: 700 16px/1 var(--f-body); color: var(--mut); }
.tabs button[aria-selected="true"] { background: var(--terra); color: #fff; }
.tabs.two { grid-template-columns: 1fr 1fr; }
.item.todo label.row { cursor: pointer; }
.item.todo input { width: 20px; height: 20px; accent-color: var(--ok); margin: 0; }
.item.todo.done .nm { text-decoration: line-through; color: var(--mut); }
.item.todo .more { padding-left: 48px; }
.btn.pend { opacity: .55; cursor: not-allowed; border-style: dashed; }
.field { display: grid; gap: 8px; }
.field > label, .field > span { font-size: 14px; color: var(--mut); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices button { padding: 10px 18px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); font: 500 15px/1.2 var(--f-body); }
.choices button[aria-pressed="true"] { background: var(--terra); color: #fff; box-shadow: none; font-weight: 700; }
.choices.sm button { padding: 8px 14px; font-size: 14px; }
.sw { display: flex; gap: 10px; flex-wrap: wrap; }
.sw button { width: 38px; height: 38px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); }
.sw button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--ink); }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; }
.stc { display: grid; justify-items: center; gap: 4px; font-size: 12px; text-align: center; color: var(--mut); }
.stc i { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--f-mono); font-style: normal; border: 2px dashed var(--line); color: var(--mut); }
.stc.on { color: var(--ink); }
.stc.on i { border: 3px double var(--terra); color: var(--terra); background: var(--terra-soft); transform: rotate(-10deg); }
.prog { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--terra); }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tasks label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 12px 14px; border-radius: 16px; border: 1.5px solid var(--line); font-size: 15px; }
.tasks input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--terra); flex: none; }
.tasks input:checked + span { text-decoration: line-through; color: var(--mut); }
.photo { width: 100%; border-radius: 18px; box-shadow: var(--sh); display: block; }

/* 引導對話 */
#modal { position: fixed; inset: 0; z-index: 12; display: grid; place-items: center; padding: 20px; background: rgba(240,232,220,.35); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
#modal .card { width: min(460px, 100%); padding: 32px 30px 28px; display: grid; gap: 16px; border-radius: 30px; background: #FDF8F2; }
#modal h2 { font: 900 30px/1.25 var(--f-body); }
#modal p { margin: 0; color: #6E5F55; font-size: 16px; line-height: 1.75; }
#modal .acts { justify-content: space-between; margin-top: 10px; align-items: center; }
#modal .skip { padding: 13px 20px; border-radius: 16px; box-shadow: inset 0 0 0 1.5px var(--line); font-size: 16px; }

#toast { position: fixed; z-index: 13; left: 50%; top: calc(var(--st) + 22px); translate: -50% 0; padding: 12px 18px; border-radius: 16px; font-weight: 700; max-width: calc(100% - 32px); text-align: center; transition: opacity .25s, transform .25s; opacity: 0; transform: translateY(-8px); pointer-events: none; background: var(--ink); color: #fff; box-shadow: var(--sh); }
#toast.on { opacity: 1; transform: none; }
.cf { position: fixed; z-index: 14; pointer-events: none; width: 10px; height: 14px; border-radius: 2px; left: 50%; top: 40%; }
#splash { position: fixed; inset: 0; z-index: 20; background: #E6EADF; display: grid; place-content: center; text-align: center; gap: 12px; transition: opacity .5s; }
#splash .w { font: 900 54px/.9 var(--f-latin); color: var(--terra); }
#splash p { margin: 0; font: 700 15px/1.4 var(--f-body); color: var(--mut); }
#splash.out { opacity: 0; visibility: hidden; transition: opacity .5s, visibility 0s .5s; }
#nogl { position: fixed; z-index: 21; inset: 0; display: grid; place-items: center; background: #E6EADF; padding: 24px; }
#nogl > div { padding: 24px; max-width: 420px; display: grid; gap: 12px; text-align: center; }

@media (min-width: 900px) {
  #sheet { left: auto; right: calc(var(--sr) + 72px); top: calc(var(--st) + 12px); bottom: 12px; width: 440px; max-height: none; border-radius: 30px; }
  #sheet .grab { display: none; }
  body.sheeted #ticker { visibility: hidden; }
}
@media (max-width: 899px) {
  body.sheeted #status, body.sheeted #ticker { visibility: hidden; }
  /* 手機：打開資訊抽屜時整排懸浮按鈕都收起來，才不會擋住關閉鈕 */
  #rail { z-index: 5; }
  body.sheeted #rail { visibility: hidden; }
  #brand { padding: 11px 15px; gap: 2px 12px; }
  #brand .w { font-size: 26px; }
  #brand .t b { font-size: 15px; letter-spacing: .04em; }
  #brand .t small, #brand .t small i { font-size: 11px; }
  #status { top: calc(var(--st) + 88px); }
  .rb { min-width: 46px; height: 46px; padding: 0 13px; font-size: 14.5px; border-radius: 16px; }
  #ticker { bottom: calc(var(--sb) + 30px); }
  .pill { font-size: 12px; padding: 6px 11px; }
  #toast { top: calc(var(--st) + 136px); }
}
@media (max-width: 380px) { #brand .w { font-size: 22px; } .rb span { display: none; } .rb { padding: 0 12px; } }
@media (hover: hover) { .rb:hover, .pill:hover, .il:hover { filter: brightness(.97); } .item > button:hover { background: #FFF9F3; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

<body>
<!-- /PREVIEW-STRIP -->

<canvas id="stage" aria-label="3D 行政群島：中心是課外組，道路連到各行政分類的建築"></canvas>
<div id="lbl"></div>

<div id="splash"><div class="w">CLUB<br>ON.</div><p>正在鋪路，連起每一個行政建築區…</p></div>

<div class="card" id="brand">
  <div class="w">CLUB<br>ON.</div>
  <div class="t"><b>東海體能社團</b><small><i>ATHLETIC</i>行政群島</small></div>
</div>
<div id="status">
  <button class="pill card" id="pOffice" type="button"><span class="lamp" id="lamp"></span><span id="officeTxt">課外組</span></button>
  <button class="pill card" id="pNext" type="button">下個截止 <b id="nextN">--</b></button>
</div>

<nav id="rail" aria-label="選單">
  <button class="rb" type="button" id="bHome" title="全景"><i>↗</i><span>全景</span></button>
  <button class="rb" type="button" id="bChar" title="角色" aria-pressed="false"><i>☺</i><span>角色</span><em class="badge n" id="stampN" hidden></em></button>
  <button class="rb" type="button" id="bList" title="清單" aria-pressed="false"><i>≡</i><span>清單</span></button>
  <button class="rb" type="button" id="bDl" title="截止" aria-pressed="false"><i>◷</i><span>截止</span><em class="badge" id="dlN" hidden></em></button>
  <button class="rb" type="button" id="bTodo" aria-pressed="false" title="任務"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l1.6 1.6L7.5 4.7"/><path d="M3 12l1.6 1.6 2.9-2.9"/><path d="M3 18l1.6 1.6 2.9-2.9"/><path d="M11 6h10M11 12h10M11 18h10"/></svg><span>任務</span><em class="badge n" id="todoN" hidden></em></button>
  <button class="rb" type="button" id="bNews" aria-pressed="false" title="公告"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5v3a1 1 0 0 0 1 1h2.5L15 19V5L6.5 9.5H4a1 1 0 0 0-1 1z"/><path d="M7 14.5l1.2 4.5h2.3"/><path d="M18.5 9a4 4 0 0 1 0 6"/></svg><span>公告</span><em class="badge" id="newsN" hidden></em></button>
</nav>

<button class="card" id="ticker" type="button"><span class="f">山君</span><span id="tk"></span></button>

<section id="sheet" hidden aria-live="polite">
  <div class="grab" aria-hidden="true"></div>
  <button class="x" id="sx" type="button" aria-label="關閉">✕</button>
  <div id="sbody"></div>
  <button class="btn" id="toTop" type="button" hidden aria-label="回到最頂" title="回到最頂">⬆</button>
</section>

<div id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="kick" id="mKick"></div>
    <h2 id="mTitle"></h2>
    <p id="mText" style="white-space: pre-line"></p>
    <div class="acts"><button class="skip" type="button" id="mSkip">略過</button><button class="btn big ring" type="button" id="mNext">下一步 →</button></div>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="js/data.js"></script>
<script type="module" src="js/game.js"></script>
