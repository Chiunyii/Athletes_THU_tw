<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- /PREVIEW-STRIP -->
<title>東海體能島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="東海大學體能性社團幹部的互動島嶼：走訪各建築查看行政公告、截止日、辦事流程與課外組辦公時間。">
<meta name="theme-color" content="#5ec4dc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 全螢幕 3D 島嶼為底；上方狀態貼紙、下方遊戲按鈕列、右側（手機為底部）資訊卡。 */
:root {
  --ink: #1d3142;          /* 外框、文字 */
  --card: #fffdf6;         /* 卡片底 */
  --card-2: #f1f6f2;       /* 卡片內區塊 */
  --muted: #5d6f78;
  --line: #1d3142;
  --soft-line: #d9e2df;
  --grass: #3f9a52;        /* 主色：草地綠 */
  --grass-soft: #e0f1e2;
  --sun: #ffc83d;          /* 提醒黃 */
  --sun-soft: #fff1c9;
  --coral: #e5483b;        /* 緊急紅 */
  --coral-soft: #fde3e0;
  --sea: #5ec4dc;
  --shadow: rgba(29,49,66,.9);
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", "Noto Sans TC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #eef4f1; --card: #182733; --card-2: #203341; --muted: #a2b4bb; --line: #0b141b; --soft-line: #2c4352;
    --grass: #5cc777; --grass-soft: #17392a; --sun: #ffd25e; --sun-soft: #3d3317; --coral: #ff7b6f; --coral-soft: #44221f;
    --shadow: rgba(0,0,0,.75); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #eef4f1; --card: #182733; --card-2: #203341; --muted: #a2b4bb; --line: #0b141b; --soft-line: #2c4352;
  --grass: #5cc777; --grass-soft: #17392a; --sun: #ffd25e; --sun-soft: #3d3317; --coral: #ff7b6f; --coral-soft: #44221f;
  --shadow: rgba(0,0,0,.75); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--sea); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--grass); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#scene.pointer { cursor: pointer; }

/* 貼紙風格 */
.sticker { background: var(--card); border: 2px solid var(--line); border-radius: 14px; box-shadow: 0 3px 0 var(--shadow); }

/* 上方狀態列 */
.top {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 4; pointer-events: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap;
}
.top > * { pointer-events: auto; }
.title { padding: 8px 14px; }
.title h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: .06em; line-height: 1.2; }
.title small { color: var(--muted); font-size: 12px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.chip { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
.chip:hover { transform: translateY(-1px); }
.lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.lamp.on { background: var(--grass); box-shadow: 0 0 0 3px var(--grass-soft); }
.lamp.off { background: var(--coral); }
.chip .num { font-size: 20px; line-height: 1; color: var(--coral); }

/* 下方按鈕列 */
.dock {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 4;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 6px; padding: 6px; max-width: calc(100% - 24px); overflow-x: auto; scrollbar-width: none;
}
.dock::-webkit-scrollbar { display: none; }
.dock button {
  position: relative; border: 0; background: transparent; cursor: pointer; border-radius: 10px;
  padding: 6px 12px; display: grid; justify-items: center; gap: 0; font-size: 13px; font-weight: 700; white-space: nowrap;
}
.dock button:hover { background: var(--card-2); }
.dock svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.badge {
  position: absolute; top: 0; right: 4px; min-width: 18px; padding: 0 5px; border-radius: 999px;
  background: var(--coral); color: #fff; font-size: 11px; line-height: 18px; text-align: center; border: 2px solid var(--card);
}

/* 3D 標籤 */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.label {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap;
  padding: 2px 10px; font-size: 13px; font-weight: 700; border-radius: 999px; pointer-events: auto; cursor: pointer;
  background: var(--card); border: 2px solid var(--line); box-shadow: 0 2px 0 var(--shadow);
  display: flex; align-items: center; gap: 5px; transition: opacity .2s;
}
.label .stamp { width: 14px; height: 14px; border-radius: 50%; border: 2px dashed var(--muted); flex: none; }
.label.done .stamp { border: 0; background: var(--grass); box-shadow: inset 0 0 0 3px var(--card), 0 0 0 1px var(--grass); }
.label.hidden { opacity: 0; pointer-events: none; }

/* 對話框（老師 NPC） */
.talk {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
  bottom: calc(92px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 24px));
  padding: 16px 18px 14px; display: grid; gap: 10px;
}
.talk .who { font-weight: 900; color: var(--grass); font-size: 14px; }
.talk p { margin: 0; font-size: 15px; }
.talk .row { justify-content: flex-end; }

/* 資訊卡 */
.panel {
  position: fixed; z-index: 5; right: max(12px, env(safe-area-inset-right, 0px));
  top: calc(78px + env(safe-area-inset-top, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  width: min(420px, calc(100% - 24px)); display: flex; flex-direction: column; overflow: hidden;
}
.panel header { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px 10px; border-bottom: 2px solid var(--soft-line); }
.panel .kicker { font-size: 12px; letter-spacing: .12em; color: var(--grass); font-weight: 900; }
.panel h2 { margin: 0; font-size: 20px; font-weight: 900; line-height: 1.3; text-wrap: balance; }
.close { margin-left: auto; border: 2px solid var(--line); background: var(--card-2); border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.panel .body { padding: 14px 16px 18px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.panel .body p { margin: 0; }
.stamped { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--grass); background: var(--grass-soft); padding: 2px 10px; border-radius: 999px; width: fit-content; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; text-decoration: none; cursor: pointer;
  padding: 7px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--shadow);
}
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.go { background: var(--grass); color: #fff; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 13px; }
.box { background: var(--card-2); border-radius: 12px; padding: 12px 14px; }
ol.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; }
ul.tips { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: 14px; }

/* 截止日 */
.dl { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.dl li { display: grid; grid-template-columns: 58px 1fr; gap: 12px; padding: 12px; border-radius: 12px; background: var(--card-2); }
.dl li > div { min-width: 0; }
.days { text-align: center; border-radius: 10px; padding: 4px 0; background: var(--grass-soft); color: var(--grass); align-self: start; }
.days b { display: block; font-size: 28px; line-height: 1.05; }
.days small { font-size: 11px; }
.lvl-warn .days { background: var(--sun-soft); color: var(--ink); }
.lvl-hot .days { background: var(--coral-soft); color: var(--coral); }
.dl h3 { margin: 0; font-size: 15px; }
.meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 6px; }
.tag { font-size: 11px; padding: 0 7px; border-radius: 4px; border: 1px solid var(--soft-line); color: var(--muted); }
.dl p { margin: 0 0 8px; font-size: 13px; }

/* 公告 */
.news { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.news li { background: var(--card-2); border-radius: 12px; padding: 10px 12px; }
.news h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.news .new { font-size: 11px; color: #fff; background: var(--coral); border-radius: 4px; padding: 0 6px; }
.news .pin { font-size: 11px; color: var(--coral); font-weight: 900; }
.news p { margin: 4px 0 0; font-size: 14px; }

/* 週表 */
.week { width: 100%; border-collapse: collapse; font-size: 14px; }
.week td { padding: 6px 4px; border-bottom: 1px solid var(--soft-line); }
.week td:first-child { font-weight: 700; white-space: nowrap; width: 7.5em; }
.week .today td { background: var(--grass-soft); }
.big-status { display: flex; gap: 10px; align-items: center; font-size: 17px; font-weight: 900; }

/* 地圖清單與搜尋 */
.places { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.places button { text-align: left; border: 2px solid var(--soft-line); background: var(--card-2); border-radius: 12px; padding: 10px; cursor: pointer; display: grid; gap: 2px; }
.places button:hover { border-color: var(--line); }
.places b { font-size: 14px; }
.places span { font-size: 12px; color: var(--muted); }
.places .ok { color: var(--grass); font-weight: 700; }
.search { width: 100%; font: inherit; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
.results { display: grid; gap: 8px; }
.results button { text-align: left; border: 0; background: var(--card-2); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; }
.results small { color: var(--muted); }
mark { background: var(--sun-soft); color: inherit; }

/* 集章本 */
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
.stampcell { display: grid; justify-items: center; gap: 4px; font-size: 12px; text-align: center; border: 0; background: none; cursor: pointer; padding: 0; }
.stampcell i {
  width: 58px; height: 58px; border-radius: 50%; border: 2px dashed var(--soft-line); display: grid; place-items: center;
  font-style: normal; font-weight: 900; font-size: 13px; color: var(--muted);
}
.stampcell.done i { border: 3px double var(--coral); color: var(--coral); transform: rotate(-12deg); background: var(--coral-soft); }
.progress { height: 10px; border-radius: 999px; background: var(--soft-line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--grass); transition: width .4s; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tasks label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 8px 10px; border-radius: 10px; background: var(--card-2); font-size: 14px; }
.tasks input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--grass); flex: none; }
.tasks input:checked + span { text-decoration: line-through; color: var(--muted); }

.hint {
  position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  padding: 6px 14px; font-size: 13px; font-weight: 700; white-space: nowrap;
}
.toast {
  position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); top: calc(84px + env(safe-area-inset-top, 0px));
  padding: 8px 16px; font-weight: 700; font-size: 14px;
}
.loading { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: var(--sea); }
.loading div { padding: 14px 22px; font-weight: 900; }
.nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; z-index: 9; background: var(--sea); }
.nogl > div { padding: 20px; max-width: 420px; display: grid; gap: 10px; }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; animation: fall 2.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }

@media (max-width: 700px) {
  .panel { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; top: auto; max-height: 62vh; bottom: calc(94px + env(safe-area-inset-bottom, 0px)); }
  .toast { top: auto; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); z-index: 9; }
  .title h1 { font-size: 17px; }
  .chip { font-size: 12px; padding: 5px 10px; }
  .chip .num { font-size: 17px; }
  .dock button { padding: 5px 9px; font-size: 12px; }
  .label { font-size: 12px; padding: 1px 8px; }
}
</style>
<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>

<body>
<!-- /PREVIEW-STRIP -->

<canvas id="scene" aria-label="東海體能島 3D 地圖，點建築物可查看資訊"></canvas>
<div id="labels" aria-hidden="true"></div>

<div class="top">
  <div class="title sticker">
    <h1>東海體能島</h1>
    <small id="term">學期</small>
  </div>
  <div class="chips">
    <button class="chip sticker" id="chipOffice" type="button"><span class="lamp" id="lamp"></span><span id="officeText">課外組</span></button>
    <button class="chip sticker" id="chipNext" type="button"><span>下個截止</span><span class="num" id="nextDays">--</span><span id="nextUnit">天</span></button>
  </div>
</div>

<div class="hint sticker" id="hint">點建築物，角色會走過去；拖曳可旋轉島嶼</div>

<nav class="dock sticker" aria-label="遊戲選單">
  <button type="button" data-open="map"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>地圖</button>
  <button type="button" data-open="deadlines"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>截止日</button>
  <button type="button" data-open="news"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>公告<span class="badge" id="unread" hidden></span></button>
  <button type="button" data-open="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>搜尋</button>
  <button type="button" data-open="book"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="6"/><path d="m8.5 15-1.5 7 5-3 5 3-1.5-7"/></svg>集章 <span class="num" id="stampCount">0/0</span></button>
  <button type="button" data-open="links"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>連結</button>
</nav>

<section class="panel sticker" id="panel" hidden aria-live="polite">
  <header>
    <div><div class="kicker" id="pKicker"></div><h2 id="pTitle"></h2></div>
    <button class="close" id="pClose" type="button" aria-label="關閉">×</button>
  </header>
  <div class="body" id="pBody"></div>
</section>

<section class="talk sticker" id="talk" hidden>
  <div class="who" id="talkWho">課外組老師</div>
  <p id="talkText"></p>
  <div class="row"><a class="btn" href="list.html">文字版</a><button class="btn go" id="talkNext" type="button">下一句</button></div>
</section>

<div class="toast sticker" id="toast" role="status" hidden></div>
<div class="loading" id="loading"><div class="sticker">島嶼載入中…</div></div>

<script src="js/data.js"></script>
<script type="module" src="js/game.js"></script>

</body>
</html>
